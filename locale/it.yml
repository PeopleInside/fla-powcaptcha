peopleinside-powcaptcha:
  admin:
    settings:
      enabled_login_label: Abilita CAPTCHA sul Login
      enabled_login_help: Mostra la verifica di sicurezza PoW nel modulo di accesso.
      enabled_signup_label: Abilita CAPTCHA sulla Registrazione
      enabled_signup_help: Mostra la verifica di sicurezza PoW nel modulo di registrazione.
      enabled_forgot_label: Abilita CAPTCHA sul Recupero Password
      enabled_forgot_help: Mostra la verifica di sicurezza PoW nel modulo di recupero password.
      level_label: Livello di difficoltà
      level_help: "Il lavoro che il browser di ogni visitatore deve svolgere. I tempi sono indicativi, misurati su un PC recente; gli smartphone sono 3–6 volte più lenti. Con la difficoltà adattiva attiva, le reti con comportamenti sospetti ricevono automaticamente fino a 8 bit in più (fino a 24 bit in totale). Ogni bit raddoppia il lavoro: i livelli 4 e 5 penalizzano molto chi usa uno smartphone, valuta di usarli solo durante un attacco."
      level_1: "Livello 1 – Leggero (istantaneo su PC)"
      level_2: "Livello 2 – Bilanciato (≈ 0,1 s su PC)"
      level_3: "Livello 3 – Forte (≈ 1–3 s su PC, 5–10 s su smartphone, consigliato)"
      level_4: "Livello 4 – Molto forte (≈ 4–12 s su PC, 20–60 s su smartphone)"
      level_5: "Livello 5 – Massimo (≈ 15–50 s su PC, oltre 1–3 min su smartphone: solo in caso di attacco)"
      signup_limit_label: "Massimo registrazioni per IP ogni 24 ore"
      signup_limit_help: "Limite mobile di 24 ore agli account creabili dalla stessa rete (IPv6: stesso /64). 0 = nessun limite. Conta solo dopo la creazione effettiva dell'account; gli account creati da un admin sono ignorati. Viene salvato per 48 ore solo un hash con chiave della rete. Richiede il rilevamento corretto dell'IP reale dietro proxy/CDN (vedi README)."
      login_limit_label: "Massimo tentativi di login per IP ogni 10 minuti"
      login_limit_help: "Oltre questo limite la rete viene bloccata per 15 minuti (vale anche per /api/token se protetto). 0 = nessun limite."
      forgot_limit_label: "Massimo richieste reset password per IP ogni ora"
      forgot_limit_help: "Oltre questo limite la rete viene bloccata per 1 ora. 0 = nessun limite."
      behavior_checks_label: "Controlli sul comportamento"
      behavior_checks_help: "Rifiuta o rende più difficili le richieste che sembrano automatiche: User-Agent assente o da bot, Accept-Language assente, Origin cross-site e modulo inviato senza alcuna attività reale di mouse, tastiera o focus. Non viene salvato nulla."
      adaptive_label: Difficoltà adattiva
      adaptive_help: "Aumenta automaticamente la difficoltà per le reti con ripetute verifiche fallite o molte registrazioni in pochi minuti, e per tutti durante un attacco al sito. Usa contatori anonimi temporanei in cache; non viene memorizzato nulla."
      protect_token_endpoint_label: Proteggi anche l'endpoint API di login (/api/token)
      protect_token_endpoint_help: "I bot possono accedere chiamando direttamente /api/token, saltando il modulo di login. Se attivo, le chiamate dirette devono includere un token CAPTCHA (GET /api/powcaptcha/challenge?action=token). Disattivalo se app mobile o altre integrazioni accedono tramite API senza browser."
      log_enabled_label: Mantieni un registro eventi
      log_enabled_help: "Memorizza orario, modulo, esito e motivo tecnico delle verifiche recenti. Vengono conservate solo le voci più recenti (vedi l'opzione successiva per il numero)."
      log_keep_label: "Voci del registro da conservare (per esito)"
      log_keep_help: "Quante verifiche riuscite e quante fallite conservare nel registro (quindi fino al doppio di questo numero di righe in totale). Le voci più vecchie vengono eliminate automaticamente, anche quando abbassi questo valore. Intervallo consentito 10-1000, predefinito 100. Tienilo al minimo che ti serve: con la registrazione degli IP attiva, un valore più basso significa meno dati personali memorizzati."
      log_prune_age_label: "Elimina anche le voci del registro più vecchie di un certo numero di giorni"
      log_prune_age_help: "Attiva di default. Le voci più vecchie del numero di giorni impostato qui sotto vengono eliminate automaticamente, anche se il registro non ha raggiunto il limite di dimensione (ad esempio su un sito poco frequentato). Disattivala per conservare le voci finché non vengono sostituite da quelle più recenti."
      log_max_age_days_label: "Elimina le voci più vecchie di (giorni)"
      log_max_age_days_help: "Usata quando l'opzione qui sopra è attiva. Intervallo consentito 1-365, predefinito 30. Imposta un valore più alto se vuoi poter guardare più indietro nel tempo; con la registrazione degli IP attiva, un valore più basso significa meno dati personali memorizzati."
      log_ip_label: "Registra e visualizza gli indirizzi IP nei log (attenzione: GDPR)"
      log_ip_help: "ATTENZIONE: l'indirizzo IP è un dato personale ai sensi del GDPR. Attivando questa opzione diventi tu, come titolare del trattamento, responsabile di avere una base giuridica valida (ad es. il legittimo interesse per la sicurezza), di indicare il trattamento nell'informativa privacy, di limitarne la conservazione e di rispondere alle richieste degli interessati. Un uso non conforme può costituire una violazione del GDPR e comportare sanzioni. Gli IP vengono conservati solo finché la voce resta tra gli eventi più recenti conservati (vedi 'Voci del registro da conservare') e non supera il numero di giorni impostato, oppure fino allo svuotamento del registro. Disattivata per impostazione predefinita: se non ti serve, lasciala spenta. Non è consulenza legale; in caso di dubbi rivolgiti a un professionista."
      privacy_notice_label: "Mostra un'informativa privacy sotto il CAPTCHA"
      privacy_notice_help: "Attiva di default. Mostra sotto il CAPTCHA un piccolo link \"Privacy\" che apre una breve spiegazione di cosa tratta la verifica. Il testo si adatta alle tue impostazioni (controlli comportamentali, registrazione IP, conservazione). Non sostituisce la tua informativa privacy."
      privacy_url_label: "Link alla privacy policy (facoltativo)"
      privacy_url_help: "Indirizzo completo (https://...) oppure un percorso del tuo sito (/privacy). Se impostato, l'informativa include un link. Lascia vuoto per mostrarla senza link. Altri tipi di indirizzo vengono ignorati."
      privacy_align_label: "Allineamento del link Privacy"
      privacy_align_help: "Dove si trova il link Privacy sotto il CAPTCHA. A sinistra è allineato allo stato della verifica; al centro segue i moduli centrati di Flarum. Il popover con la spiegazione usa sempre l'intera larghezza del modulo."
      privacy_align_left: Sinistra
      privacy_align_center: Centro
      privacy_align_right: Destra
    logs:
      title: Ultimi eventi CAPTCHA
      help: "Si conservano le ultime {count} verifiche riuscite e {count} fallite; le più vecchie vengono eliminate automaticamente. Gli indirizzi IP vengono memorizzati e visualizzati solo se la relativa opzione è stata abilitata nelle impostazioni."
      help_age: "Le voci più vecchie di {days} giorni vengono eliminate automaticamente."
      refresh: Aggiorna
      clear: Svuota registro
      confirm_clear: Eliminare tutte le voci del registro CAPTCHA? L'operazione non è reversibile.
      cleared: Registro CAPTCHA svuotato.
      load_error: Impossibile caricare il registro.
      empty: Nessun evento registrato finora.
      ip_banner_enabled: "Attenzione: gli indirizzi IP sono dati personali (GDPR). Assicurati di avere una base giuridica, di averli indicati nell'informativa privacy e di non conservarli più del necessario. Svuota il registro quando non ti servono più."
      ip_banner_disabled: "Gli indirizzi IP non vengono registrati né mostrati (opzione disattivata di default per conformità al GDPR). Per attivarli, abilita l'opzione 'Registra e visualizza gli indirizzi IP nei log' tra le impostazioni sopra, dopo aver valutato gli obblighi GDPR."
      filter_all: Tutti
      filter_ok: Superati
      filter_fail: Falliti
      col_time: Data e ora
      col_ip: Indirizzo IP
      col_form: Modulo
      col_result: Esito
      col_reason: Motivo
      col_difficulty: Difficoltà (bit)
      result_ok: Superato
      result_fail: Fallito
      actions:
        login: Login
        signup: Registrazione
        forgot: Recupero password
        token: Login via API
      reasons:
        ok: Verificato
        missing: Nessun token inviato (bot senza JavaScript?)
        malformed: Token non valido
        wrong_action: Token emesso per un altro modulo
        bad_signature: Challenge contraffatta o alterata
        wrong_network: Rete cambiata dopo l'emissione della challenge
        expired: Challenge scaduta
        too_fast: Inviato troppo in fretta
        bad_solution: Prova di lavoro errata o insufficiente
        replayed: Token già utilizzato
        honeypot: Campo nascosto compilato (bot)
        rate_limited: "Troppi tentativi da questa rete (bloccata)"
        signup_limit: "Limite di registrazioni raggiunto per questa rete"
        suspicious: "Comportamento automatico rilevato"
        cache_error: Cache non disponibile

  forum:
    solving: Verifica di sicurezza in corso…
    verified: Verifica di sicurezza superata
    error: Verifica di sicurezza non riuscita. Riprova.
    rate_limited: "Troppi tentativi. Riprova tra {seconds} secondi."
    retry: Riprova
    privacy:
      toggle: Privacy
      title: Informazioni sulla privacy della verifica di sicurezza
      intro: "Questa verifica di sicurezza viene eseguita nel tuo browser: non usa cookie né servizi di terze parti."
      data: "Per prevenire abusi trattiamo solo dati tecnici: un identificativo con hash della tua rete, conservato per poco tempo, e l'orario e l'esito della verifica."
      behavior: "Osserviamo anche alcune informazioni di base del browser e se hai interagito con la pagina (ad esempio attività del puntatore o della tastiera e da quanto tempo la pagina è aperta). Serve solo a distinguere le persone dai bot e non viene memorizzato."
      ip: "Il tuo indirizzo IP viene registrato nel registro di sicurezza."
      ip_days: "Il tuo indirizzo IP viene registrato nel registro di sicurezza per un massimo di {days} giorni."
      policy: Leggi l'informativa privacy
    challenge_not_ready: La verifica di sicurezza non è ancora completata. Riprova.

  validation:
    pow_captcha: Impossibile verificare il controllo di sicurezza. Riprova.
    rate_limited: "Troppi tentativi dalla tua rete. Riprova più tardi."
    signup_limit: "È stato raggiunto il numero massimo di registrazioni dalla tua rete. Riprova più tardi."
