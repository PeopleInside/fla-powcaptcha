peopleinside-powcaptcha:
  admin:
    settings:
      enabled_login_label: Abilita CAPTCHA sul Login
      enabled_login_help: Mostra la verifica di sicurezza PoW nel modulo di accesso.
      enabled_signup_label: Abilita CAPTCHA sulla Registrazione
      enabled_signup_help: Mostra la verifica di sicurezza PoW nel modulo di registrazione.
      enabled_forgot_label: Abilita CAPTCHA sul Recupero Password
      enabled_forgot_help: Mostra la verifica di sicurezza PoW nel modulo di recupero password.
      level_label: Livello di difficoltà
      level_help: "Il lavoro che il browser di ogni visitatore deve svolgere. I tempi sono indicativi, misurati su un PC recente; gli smartphone sono 3–6 volte più lenti. Con la difficoltà adattiva attiva, le reti con comportamenti sospetti ricevono automaticamente fino a due livelli in più."
      level_1: "Livello 1 – Leggero (istantaneo su PC)"
      level_2: "Livello 2 – Bilanciato (≈ 0,1 s su PC, consigliato)"
      level_3: "Livello 3 – Forte (≈ 1–3 s su PC, 5–10 s su smartphone)"
      adaptive_label: Difficoltà adattiva
      adaptive_help: "Aumenta automaticamente la difficoltà per le reti con ripetute verifiche fallite o molte registrazioni in pochi minuti, e per tutti durante un attacco al sito. Usa contatori anonimi temporanei in cache; non viene memorizzato nulla."
      protect_token_endpoint_label: Proteggi anche l'endpoint API di login (/api/token)
      protect_token_endpoint_help: "I bot possono accedere chiamando direttamente /api/token, saltando il modulo di login. Se attivo, le chiamate dirette devono includere un token CAPTCHA (GET /api/powcaptcha/challenge?action=token). Disattivalo se app mobile o altre integrazioni accedono tramite API senza browser."
      log_enabled_label: Mantieni un registro eventi
      log_enabled_help: "Memorizza orario, modulo, esito e motivo tecnico delle verifiche recenti. Vengono conservati solo gli ultimi 30 successi e 30 fallimenti."
      log_ip_label: "Registra e visualizza gli indirizzi IP nei log (attenzione: GDPR)"
      log_ip_help: "ATTENZIONE: l'indirizzo IP è un dato personale ai sensi del GDPR. Attivando questa opzione diventi tu, come titolare del trattamento, responsabile di avere una base giuridica valida (ad es. il legittimo interesse per la sicurezza), di indicare il trattamento nell'informativa privacy, di limitarne la conservazione e di rispondere alle richieste degli interessati. Un uso non conforme può costituire una violazione del GDPR e comportare sanzioni. Gli IP vengono conservati solo finché la voce resta tra gli ultimi 30 eventi riusciti e 30 falliti, oppure fino allo svuotamento del registro. Disattivata per impostazione predefinita: se non ti serve, lasciala spenta. Non è consulenza legale; in caso di dubbi rivolgiti a un professionista."
    logs:
      title: Ultimi eventi CAPTCHA
      help: "Si conservano le ultime 30 verifiche riuscite e 30 fallite; le più vecchie vengono eliminate automaticamente. Gli indirizzi IP vengono memorizzati e visualizzati solo se la relativa opzione è stata abilitata nelle impostazioni."
      refresh: Aggiorna
      clear: Svuota registro
      confirm_clear: Eliminare tutte le voci del registro CAPTCHA? L'operazione non è reversibile.
      cleared: Registro CAPTCHA svuotato.
      load_error: Impossibile caricare il registro.
      empty: Nessun evento registrato finora.
      ip_banner_enabled: "Attenzione: gli indirizzi IP sono dati personali (GDPR). Assicurati di avere una base giuridica, di averli indicati nell'informativa privacy e di non conservarli più del necessario. Svuota il registro quando non ti servono più."
      ip_banner_disabled: "Gli indirizzi IP non vengono registrati né mostrati (opzione disattivata di default per conformità al GDPR). Per attivarli, abilita l'opzione 'Registra e visualizza gli indirizzi IP nei log' tra le impostazioni sopra, dopo aver valutato gli obblighi GDPR."
      filter_all: Tutti
      filter_ok: Superati
      filter_fail: Falliti
      col_time: Data e ora
      col_ip: Indirizzo IP
      col_form: Modulo
      col_result: Esito
      col_reason: Motivo
      col_difficulty: Difficoltà
      result_ok: Superato
      result_fail: Fallito
      actions:
        login: Login
        signup: Registrazione
        forgot: Recupero password
        token: Login via API
      reasons:
        ok: Verificato
        missing: Nessun token inviato (bot senza JavaScript?)
        malformed: Token non valido
        wrong_action: Token emesso per un altro modulo
        bad_signature: Challenge contraffatta o alterata
        wrong_network: Rete cambiata dopo l'emissione della challenge
        expired: Challenge scaduta
        too_fast: Inviato troppo in fretta
        bad_solution: Prova di lavoro errata o insufficiente
        replayed: Token già utilizzato
        honeypot: Campo nascosto compilato (bot)
        cache_error: Cache non disponibile

  forum:
    solving: Verifica di sicurezza in corso…
    verified: Verifica di sicurezza superata
    error: Verifica di sicurezza non riuscita. Riprova.
    rate_limited: "Troppi tentativi. Riprova tra {seconds} secondi."
    retry: Riprova
    challenge_not_ready: La verifica di sicurezza non è ancora completata. Riprova.

  validation:
    pow_captcha: Impossibile verificare il controllo di sicurezza. Riprova.
